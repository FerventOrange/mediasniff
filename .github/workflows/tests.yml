name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # The fetchable corpus in samples/ is deliberately not committed -- it is
      # ~4 MB of third-party stream captures. Tests that need it skip cleanly.
      # These few samples are synthesised locally with no network, so they cost
      # nothing and take CI from 22 tests to 35.
      - name: Build the offline samples
        run: python tools/make_samples.py

      - name: Run tests
        run: python -m pytest tests -q

      - name: Compile-check the tools
        run: python -m py_compile src/mediasniff.py tools/*.py

      - name: Shell-check the corpus fetcher
        run: bash -n tools/fetch_samples.sh
